<!DOCTYPE html>
<html lang="zh">

<head>
    <title>Hugging Face 镜像站</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#fbfbfc" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
    <style>
        :root {
            color-scheme: light dark;
            --bg: #fbfbfc;
            --card: #ffffff;
            --text: #1c2128;
            --text-secondary: #59636e;
            --text-tertiary: #818b98;
            --border: rgba(27, 31, 36, 0.10);
            --border-strong: rgba(27, 31, 36, 0.20);
            --accent: #0b68f0;
            --accent-hover: #095bd1;
            --accent-soft: rgba(11, 104, 240, 0.09);
            --key-text: #b45309;
            --key-bg: rgba(245, 158, 11, 0.14);
            --key-border: rgba(245, 158, 11, 0.30);
            --glow: rgba(245, 158, 11, 0.06);
            --shadow-lg: 0 4px 8px rgba(27, 31, 36, 0.04), 0 16px 48px rgba(27, 31, 36, 0.14);
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d1117;
                --card: #161b22;
                --text: #e6edf3;
                --text-secondary: #9198a1;
                --text-tertiary: #6e7681;
                --border: rgba(230, 237, 243, 0.12);
                --border-strong: rgba(230, 237, 243, 0.26);
                --accent: #4493f8;
                --accent-hover: #6ba4fb;
                --accent-soft: rgba(68, 147, 248, 0.13);
                --key-text: #fbbf24;
                --key-bg: rgba(245, 158, 11, 0.12);
                --key-border: rgba(245, 158, 11, 0.28);
                --glow: rgba(245, 158, 11, 0.05);
                --shadow-lg: 0 4px 8px rgba(0, 0, 0, 0.3), 0 16px 48px rgba(0, 0, 0, 0.55);
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            margin: 0;
            padding: 0 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(560px 260px at 50% 0%, var(--glow), transparent 70%),
                var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            padding: 40px 36px 32px;
            text-align: center;
            animation: card-in 320ms cubic-bezier(0.23, 1, 0.32, 1) backwards;
        }

        @keyframes card-in {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.98);
            }
        }

        .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 18px;
            background: var(--key-bg);
            border: 1px solid var(--key-border);
            color: var(--key-text);
            margin-bottom: 20px;
        }

        .icon svg {
            width: 24px;
            height: 24px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .card p {
            margin: 0 0 10px;
            font-size: 14.5px;
            line-height: 1.8;
            color: var(--text-secondary);
            text-align: left;
            text-wrap: pretty;
        }

        .card a {
            color: var(--accent);
            font-weight: 500;
            text-decoration: none;
        }

        @media (hover: hover) and (pointer: fine) {
            .card a:hover {
                color: var(--accent-hover);
                text-decoration: underline;
                text-underline-offset: 3px;
            }
        }

        .card code {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            font-size: 0.875em;
            background: var(--accent-soft);
            color: var(--accent);
            border-radius: 5px;
            padding: 0.15em 0.4em;
        }

        .actions {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
            padding-top: 22px;
            border-top: 1px solid var(--border);
        }

        button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font: inherit;
            font-size: 14px;
            font-weight: 550;
            border-radius: 999px;
            padding: 9px 20px;
            cursor: pointer;
            word-break: keep-all;
            transition: background-color 120ms ease, color 120ms ease,
                border-color 120ms ease, transform 120ms cubic-bezier(0.23, 1, 0.32, 1);
        }

        button:active {
            transform: scale(0.97);
        }

        button svg {
            width: 15px;
            height: 15px;
        }

        .back-button {
            color: var(--text-secondary);
            background: none;
            border: 1px solid var(--border-strong);
        }

        @media (hover: hover) and (pointer: fine) {
            .back-button:hover {
                color: var(--text);
                background: var(--accent-soft);
                border-color: var(--text-tertiary);
            }
        }

        .apply-button {
            color: #fff;
            background: var(--accent);
            border: 1px solid transparent;
        }

        @media (hover: hover) and (pointer: fine) {
            .apply-button:hover {
                background: var(--accent-hover);
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 32px 24px 26px;
            }

            .card p {
                text-align: left;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .card {
                animation: none;
            }

            button:active {
                transform: none;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path
                    d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4" />
            </svg>
        </span>
        <h1>该模型需要访问许可</h1>
        <p>如需下载 Gated Model，请先点击下方按钮前往 Hugging Face 官方申请入口。</p>
        <p>申请通过后在 <a href="https://huggingface.co/settings/tokens">官方页面这里</a> 获取 <code>access token</code>，再使用命令行下载。</p>
        <p><code>access token</code> 的使用方法见本站首页说明。</p>
        <div class="actions">
            <button type="button" class="back-button" onclick="goBack()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12" />
                    <polyline points="12 19 5 12 12 5" />
                </svg>
                返回上一页
            </button>
            <button type="button" class="apply-button" id="applyButton" onclick="redirectToOfficialApplicationPage()">
                <span id="applyButtonLabel">前往官方入口</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12" />
                    <polyline points="12 5 19 12 12 19" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        function goBack() {
            window.history.back();
        }

        function redirectToOfficialApplicationPage() {
            const params = new URLSearchParams(window.location.search);
            const nextPage = params.get('next');
            if (nextPage) {
                const officialPageUrl = `https://huggingface.co${nextPage}`;
                window.location.href = officialPageUrl;
            } else {
                const officialPageUrl = `https://huggingface.co/login`;
                window.location.href = officialPageUrl;
            }
        }

        // Dynamically update the button text based on the 'next' URL parameter
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const nextPage = params.get('next');
            if (nextPage) {
                const projectPathSegments = nextPage.split('/');
                const projectName = projectPathSegments.length > 2 ? projectPathSegments[1] + '/' + projectPathSegments[2] : '项目';
                document.getElementById('applyButtonLabel').textContent = `前往官方 ${projectName} 申请入口`;
            }
        };
    </script>
</body>

</html>
